  url: "https://youtu.be/U1zaZ-SCmvc"
  title: "On Discovering Pulsars"
  guest: "Jocelyn Bell Burnell"
  # A few lines about the guest, shown next to the video.
  about: >-
    I had the privilege of interviewing Professor Dame Jocelyn Bell Burnell,
    the astrophysicist who discovered pulsars. In 1967, as a PhD student at
    Cambridge, she noticed a tiny, regular "bit of scruff" in her radio
    telescope data. It turned out to be the first pulsar, a rapidly spinning
    neutron star, and one of the great discoveries of twentieth-century
    astronomy. She has since become one of science's most inspiring voices,
    and in 2018 she gave her entire Breakthrough Prize to fund PhD
    scholarships for students from under-represented groups in physics.

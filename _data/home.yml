# Short introductions shown under each section heading on the home page.

intellectual_rigour: >-
  Intellectual Rigour is my YouTube channel of long-form conversations with
  leading scientists and mathematicians. I sit down with them to talk about
  their lives, the paths that led them into science, and the ideas they have
  spent their careers thinking about, so that their stories can reach students
  and curious minds everywhere. Guests so far include Rajesh Gopakumar, Atish
  Dabholkar, Abhay Ashtekar and Sujatha Ramdorai.

poetry: >-
  Writing poetry became a habit of mine during my college days. Gujarati is my
  mother tongue, so most of what I wrote is in Gujarati, with a few poems in
  English and some in Hindi. I have not put all of my poems here, only a
  selected few from those years.

reflections: >-
  I am not a very regular writer. Every now and then I reflect on an idea, or
  simply on my own thoughts, and I jot them down. These notes are not written
  for anyone's reading; I write them for my own satisfaction, out of habit,
  whenever I feel like putting something down. That's all they are.

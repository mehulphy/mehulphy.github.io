- title: Physics Teacher, Higher Secondary Division
  org: Heaven Vidhyalaya, Vadodara, Gujarat
  period: Aug 2005 to Apr 2010
  description: >-
    Headed the Physics Department of the Higher Secondary Division. Planned the
    annual curriculum and year planner, taking direct responsibility for
    teaching and assessment. Taught Physics theory and laboratory courses
    across Std. 11 and 12, with over 200 students each year. Built a culture of
    inquiry through student-led projects, including a self-initiated
    scientist-biography poster campaign that transformed the department's
    laboratories, alongside quizzes and hands-on laboratory work; encouraged
    students to question assumptions, reason from evidence, and construct
    their own understanding.

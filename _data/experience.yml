- title: Chief Learning Officer
  org: Qubits Learning (Yardstick and Qubits Group) · India | UAE | UK | USA
  period: Apr 2023 to now
  description: >-
    Driving curriculum design, research, and development for K-12 computer
    science aligned to ISTE and CSTA standards, extending recently into AP
    Computer Science and AI curriculum design, together with the associated
    teacher training, to enhance accessibility and foster mastery across
    diverse CS domains, empowering the next generation of innovators.

- title: Chief Learning Officer
  org: Yardstick Educational Initiatives (Yardstick and Qubits Group)
  period: Nov 2020 to Mar 2023
  description: >-
    Led curriculum design and development for BeeCurious, a suite of
    inquiry-based, hands-on science modules, including environmental science,
    built to international standards: Next Generation Science Standards
    (NGSS), British National Curriculum, Cambridge International Examinations

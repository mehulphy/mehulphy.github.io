- title: State Teaching and Learning Lead
  org: Central Square Foundation, New Delhi
  period: Mar 2020 to Nov 2020
  description: >-
    Co-led the design and implementation of in-classroom teaching and learning
    modules as part of the Gujarat Education Coalition (GEC), formed by CSF and
    Reach to Teach, with Better Purpose (UK) as advisory, partnering with
    Language Learning Foundation on literacy and Akshara Foundation on
    foundational numeracy; designed train-the-trainer programmes for block- and
    cluster-level teacher trainers. Worked with researchers and CSF's internal
    research team to identify areas for action research to improve the
    programme. Primarily guided and supported science teachers creating
    GCERT-owned English-medium video lessons, reviewing their content and
    helping them adapt their teaching for video; the completed material was
    broadcast statewide through the Vande Gujarat channel during COVID-19
    school closures. Participated in a GCERT-led state group that developed
    approaches for implementing the National Education Policy 2020 within
    Gujarat, with specific responsibility for experiential learning in
    schools. Concurrently served as Key Resource Person for Science (English
    Medium) at the State Teachers' Training Institute (STTI/GCERT),
    Gandhinagar, contributing to official school curriculum content
    (September to October 2020); awarded STTI certificates for script writing,
    editing, and recording.


- name: Intellectual Rigour
  meta: Creator and host · YouTube · 2024 to now
  url: https://www.youtube.com/@IntellectualRigour
  description: >-
    Long-form conversations with leading scientists and mathematicians,
    sharing their stories and ideas with a global audience (25,000+
    subscribers). Guests include Prof. Rajesh Gopakumar (Director, ICTS-TIFR),
    Prof. Atish Dabholkar (Director, ICTP), Prof. Abhay Ashtekar, Prof. Ajoy
    Ghatak, Prof. Tarun Souradeep (Director, Raman Research Institute), Prof.
    Naresh Dadhich and Prof. Ajit Kembhavi (former Directors, IUCAA), and
    Prof. Sujatha Ramdorai.

- name: Career Guidance Seminars
  meta: Volunteer · Raika Education Charitable Trust (RECT)
  description: >-
    Community career-guidance seminars for an underserved, largely uneducated
    pastoral community, helping students see realistic pathways after Grade 10.

- name: Vigyan Rail (Science on Wheels)
  meta: Volunteer explainer · During M.Sc. (2003 to 2005)
  description: >-
    With the Department of Atomic Energy and Vigyan Prasar at the Vadodara
    halt: four days in the nuclear physics carriage, explaining medical uses of
    radiation such as gamma rays in cancer detection and treatment.

- name: Amateur Astronomers’ Association of Vadodara (AAAV)
  meta: Member · During B.Sc. and M.Sc.
  description: >-
    Overnight observation field trips and Messier Marathons; organised
    night-sky observation sessions with the Physics Department's 8-inch
    refractor as Academic Secretary of the Physical Society.

workshops_intro: >-
  Professional development workshops on inquiry-based learning, STEM
  education, experiential learning, the nature of science, and effective
  classroom assessment for over 300 teachers across 50+ schools in eight
  states between 2010 and 2022, covering national and international curricula
  (CBSE, ICSE, Cambridge). The full log of sessions follows, most recent first.

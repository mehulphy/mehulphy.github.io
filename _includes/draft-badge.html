{%- comment -%} Shows a "Draft" label for files in _drafts/ or _poem_drafts/. These folders are gitignored, so the label only ever appears in the local preview. {%- endcomment -%}
{%- assign d = include.doc -%}
{%- if d.collection == "poem_drafts" or d.path contains "_drafts/" -%}<span class="draft-badge">Draft</span>{%- endif -%}

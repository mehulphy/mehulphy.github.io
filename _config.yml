title: Quantum Reflections
tagline: Learn · Educate · Enlighten
description: >-
  Quantum Reflections: reflections by Mehul Desai on physics, science,
  education, and learning.
url: "https://mehulphy.github.io"
baseurl: ""

author:
  name: Mehul Desai
  # Email is split so the full address never appears in the built site or RSS feed.
  email_user: quantumehul
  email_domain: gmail.com
  linkedin: mehulphy
  github: mehulphy
  gitlab: mehulphy
  twitter: mehulphy
  intellectualrigour_web: https://intellectualrigour.org
  intellectualrigour_yt: https://www.youtube.com/@IntellectualRigour

permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-redirect-from

feed:
  path: feed.xml

collections:
  poems:
    output: true
    permalink: /poetry/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: poems
    values:
      layout: poem

exclude:
  - Gemfile
  - Gemfile.lock
  - .DS_Store
  - README.md
  - vendor/
  - "*.zip"
  - "*.tex"
  - "*.pdf"
  - "We were scalars.md"
  - "મારી ગુજરાતી કૃતિઓ.md"
